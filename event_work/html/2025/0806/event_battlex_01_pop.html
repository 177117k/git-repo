<style type="text/css">
/*****************************************/
/* 공통 event.css에 업데이트 필요한 스타일 */
/*****************************************/
.event-wrap .brd-detail .inner .btn-wrap .btn-event {
  display: block;
  width: 100%;
  height: auto;
  padding: 7px 10px 8px;
  border-radius: 40px;
  line-height: 42px;
}
.event-wrap .brd-detail .inner .btn-wrap {
  max-width: 720px;
  margin: 0 auto;
}
.event-wrap .brd-detail .inner .section {
  max-width: 720px;
  margin: 0 auto;
  text-align: center;
}
.evt-guidance {
  max-width: 690px;
  margin: 40px auto 0;
}
.evt-guidance .list-item ~ .list-item {
  margin-top: 30px;
}
.evt-guidance .list-item .btn {
  display: block;
  position: relative;
  height: 52px;
  padding: 11px 22px 11px 28px;
  border: 1px solid #6d6d6d;
  border-radius: 2px;
  font-size: 24px;
  font-weight: 500;
  line-height: 27px;
  background-color: #e4e4e4;
}
.evt-guidance .list-item .btn:after {
  content: "";
  display: block;
  position: absolute;
  top: 0;
  right: 22px;
  z-index: 1;
  width: 30px;
  height: 100%;
  transform: rotate(-180deg);
  background: url(https://image-golf.sggolf.com/2022_sggolf/images/ico-folding-arrow.png) no-repeat center center;
  background-size: contain;
}
.evt-guidance .list-item ul {
  margin-top: 25px;
}
.evt-guidance .list-item ul li {
  padding-left: 27px;
  font-size: 25px;
  font-weight: 500;
  line-height: 1.4;
  color: #7c7c7c;
}
.evt-guidance .list-item ul li:before {
  top: 13px;
  width: 9px;
  height: 9px;
  background-color: #656565;
}
.evt-guidance .list-item.closed .btn:after {
  transform: rotate(0deg);
}
.evt-guidance .list-item.closed ul {
  display: none;
}
/* 모바일 (iPad 768x1024 미안) */
@media screen and (max-width:767px){
  .event-wrap {
    padding: 0 0 50px;
  }
  .event-wrap .brd-detail .inner .btn-wrap .btn-event {
    padding: 7px 10px 8px;
    line-height: 21px;
  }
  .evt-guidance {
    margin: 20px -10px 0;
  }
  .evt-guidance .list-item ~ .list-item {
    margin-top: 10px;
  }
  .evt-guidance .list-item .btn {
    height: 28px;
    padding: 5px 11px 6px 14px;
    font-size: 14px;
    line-height: 17px;
  }
  .evt-guidance .list-item .btn:after {
    right: 11px;
    width: 17px;
  }
  .evt-guidance .list-item ul {
    padding: 0 14px;
    margin-top: 12px;
  }
  .evt-guidance .list-item ul li {
    padding-left: 12px;
    font-size: 14px;
  }
  .evt-guidance .list-item ul li:before {
    top: 6px;
    width: 5px;
    height: 5px;
  }
  .evt-guidance .list-item.closed .btn:after {
    transform: rotate(0deg);
  }
  .evt-guidance .list-item.closed ul {
    display: none;
  }
}
