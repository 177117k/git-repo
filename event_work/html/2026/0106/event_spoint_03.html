<style type="text/css">
/*****************************************/
/* 공통 event.css에 업데이트 필요한 스타일 */
/*****************************************/
.event-wrap .brd-detail .inner .btn-wrap .btn-event {display: block;width: 100%;height: auto;padding: 7px 10px 8px;border-radius: 40px;line-height: 42px;}
.event-wrap .brd-detail .inner .btn-wrap {max-width: 720px;margin: 0 auto;}
.event-wrap .brd-detail .inner .section {max-width: 720px;margin: 0 auto;text-align: center;}
.evt-guidance {max-width: 690px;margin: 40px auto 0;}
.evt-guidance .list-item ~ .list-item {margin-top: 30px;}
.evt-guidance .list-item .btn {display: block;position: relative;height: 52px;padding: 11px 22px 11px 28px;border: 1px solid #6d6d6d;border-radius: 2px;font-size: 24px;font-weight: 500;line-height: 27px;background-color: #e4e4e4;}
.evt-guidance .list-item .btn:after {content: "";display: block;position: absolute;top: 0;right: 22px;z-index: 1;width: 30px;height: 100%;transform: rotate(-180deg);background: url(https://image-golf.sggolf.com/2022_sggolf/images/ico-folding-arrow.png) no-repeat center center;background-size: contain;}
.evt-guidance .list-item ul {margin-top: 25px;}
.evt-guidance .list-item ul li {padding-left: 27px;font-size: 25px;font-weight: 500;line-height: 1.4;color: #7c7c7c;}
.evt-guidance .list-item ul li:before {top: 13px;width: 9px;height: 9px;background-color: #656565;}
.evt-guidance .list-item.closed .btn:after {transform: rotate(0deg);}
.evt-guidance .list-item.closed ul {display: none;}
/* 모바일 (iPad 768x1024 미안) */
@media screen and (max-width:767px){
  .event-wrap {padding: 0 0 50px;}
  .event-wrap .brd-detail .inner .btn-wrap .btn-event {padding: 7px 10px 8px;line-height: 21px;}
  .evt-guidance {margin: 20px -10px 0;}
  .evt-guidance .list-item ~ .list-item {margin-top: 10px;}
  .evt-guidance .list-item .btn {height: 28px;padding: 5px 11px 6px 14px;font-size: 14px;line-height: 17px;}
  .evt-guidance .list-item .btn:after {right: 11px;width: 17px;}
  .evt-guidance .list-item ul {padding: 0 14px;margin-top: 12px;}
  .evt-guidance .list-item ul li {padding-left: 12px;font-size: 14px;}
  .evt-guidance .list-item ul li:before {top: 6px;width: 5px;height: 5px;}
  .evt-guidance .list-item.closed .btn:after {transform: rotate(0deg);}
  .evt-guidance .list-item.closed ul {display: none;}
}

/*****************************************/
/* 해당 이벤트 전용 스타일(1회성) */

.event-wrap .brd-detail .spoint .blind {overflow: hidden;position: absolute;width: 1px;height: 1px;padding: 0;border: 0;clip: rect(0,0,0,0);clip-path: inset(50%);margin: -1px;}

.event-wrap .brd-detail .spoint .section.sect01 .info-box01 {position: relative;max-width: 500px;margin: 0 auto;}
.event-wrap .brd-detail .spoint .section.sect01 .info-box01 img {vertical-align: top;}
.event-wrap .brd-detail .spoint .section.sect01 .info-box01 dl {display: flex;align-items: center;justify-content: space-between;position: absolute;top: -4%;left: 0;z-index: 1;width: 100%;height: 100%;padding: 0 8%;}
.event-wrap .brd-detail .spoint .section.sect01 .info-box01 dl dt {}
.event-wrap .brd-detail .spoint .section.sect01 .info-box01 dl dd {text-align: right;font-size: 18px;color: #ffc100;}
.event-wrap .brd-detail .spoint .section.sect01 .info-box01 dl dd strong {font-weight: 700;}
.event-wrap .brd-detail .spoint .section.sect02 .gift-wrap {}

.event-wrap .brd-detail .spoint .section.sect02 .gift-wrap .steps .step {flex: 1;padding: 4px 0;border: 1px solid #e6e9ed;border-radius: 10px 10px 0 0;text-align: center;font-size: 18px;line-height: 1.2em;color: #fff;background-color: #daecfa;}
.event-wrap .brd-detail .spoint .section.sect02 .gift-wrap .steps .step ~ .step {margin-left: 2px;}
.event-wrap .brd-detail .spoint .section.sect02 .gift-wrap .steps .step strong {display: block;font-size: 20px;font-weight: 700;}
.event-wrap .brd-detail .spoint .section.sect02 .gift-wrap .steps .step.active {padding: 10px 0;border: 1px solid #009fe6;background-color: #009fe6;}
.event-wrap .brd-detail .spoint .section.sect02 .gift-wrap .border-box {padding: 10px;border: 1px solid #e6e9ed;border-radius: 10px;}
.event-wrap .brd-detail .spoint .section.sect02 .gift-wrap .box {padding: 10px;border: 1px solid #e6e9ed;}
.event-wrap .brd-detail .spoint .section.sect02 .gift-wrap .box .subtxt {width: 65%;max-width: 500px;margin:0 auto;vertical-align: top;}
.event-wrap .brd-detail .spoint .section.sect02 .gift-wrap .box .during {margin-top: 10px;text-align: center;font-size: 14px;color: #009fe6;}
.event-wrap .brd-detail .spoint .section.sect02 .gift-wrap .box .list-box {display: flex;align-items: flex-start;justify-content: space-between;flex-wrap: wrap;margin-top: 20px;}
.event-wrap .brd-detail .spoint .section.sect02 .gift-wrap .box .list-box .item {flex-basis: calc(50% - 10px);position: relative;padding: 10px;margin-top: 20px;border: 1px solid #e6e9ed;}
.event-wrap .brd-detail .spoint .section.sect02 .gift-wrap .box .list-box .item:nth-child(even) {margin-left: 20px;}
.event-wrap .brd-detail .spoint .section.sect02 .gift-wrap .box .list-box .item:nth-child(1),
.event-wrap .brd-detail .spoint .section.sect02 .gift-wrap .box .list-box .item:nth-child(2) {margin-top: 0;}

.event-wrap .brd-detail .spoint .section.sect02 .gift-wrap .box .list-box .item .info-tit {margin-top: 10px;text-align: center;font-size: 20px;color: #5b5b5b;}
.event-wrap .brd-detail .spoint .section.sect02 .gift-wrap .box .list-box .item .info-total {overflow: hidden;display: flex;flex-direction: column;align-items: center;justify-content: center;position: absolute;top: -15px;right: -15px;z-index: 1;width: 56px;height: 56px;border-radius: 50%;text-align: center;font-size: 15px;font-weight: 700;line-height: 1.1em;background-color: #ffe800;}

.event-wrap .brd-detail .spoint .section.sect02 .gift-wrap .box .list-box .item .info-cnt dl dd {text-align: right;font-size: 16px;font-weight: 900;word-break: break-all;color: #009fe6;}

.event-wrap .brd-detail .spoint .section.sect02 .apply-set .item-list-bottom .item .val .unit {display: inline-block;margin-left: 6px;font-size: 12px;font-weight: 500;color: #000;}

.event-wrap .brd-detail .spoint .btn-wrap.full-list {padding: 20px 0;}

.event-wrap .brd-detail .spoint ul.btn-wrap li ~ li {margin-top: 4px;}
.event-wrap .brd-detail .spoint .event-guide {padding: 0;text-align: left;}
